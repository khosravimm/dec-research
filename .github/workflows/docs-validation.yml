name: Validate bilingual public research documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify generated bilingual roadmap matches JSON source
        run: |
          python tools/render_roadmap.py
          git diff --exit-code -- docs/en/roadmap.md docs/fa/roadmap.md
      - name: Verify warmloaded bilingual model report from experiment JSON
        run: |
          python tools/render_model_warm20.py
          git diff --exit-code -- docs/en/model-warmloaded-general20.md docs/fa/model-warmloaded-general20.md
      - name: Validate bilingual MiniCPM5 sampler ablation rendering
        run: |
          python tools/render_minicpm_sampler_ablation.py
          git diff --exit-code -- docs/en/minicpm5-sampler-ablation.md docs/fa/minicpm5-sampler-ablation.md
      - name: Verify LiquidAI bilingual model report generation
        run: |
          python tools/render_liquid_warm20.py
          git diff --exit-code -- docs/en/liquid-warmloaded-general20.md docs/fa/liquid-warmloaded-general20.md
      - name: Verify English-only tool and instruction bilingual report
        run: |
          python tools/render_english_instruction_tools.py
          git diff --exit-code -- docs/en/model-english-instruction-tools.md docs/fa/model-english-instruction-tools.md
      - name: Verify bilingual next-generation backbone research catalogue
        run: |
          python tools/render_model_candidates_20261112.py
          git diff --exit-code -- docs/en/model-candidates-20261112.md docs/fa/model-candidates-20261112.md
      - name: Validate public research dossiers
        run: python tools/validate_public_docs.py
